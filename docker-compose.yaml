services:
  # База данных PostgreSQL
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  # Redis (очереди задач)
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Бэкенд (Django)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # Celery (воркер задач)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A myproject beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  # Celery Beat (планировщик задач)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A myproject beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
